services:
  - type: web
    name: chatgpt-x1-mobile
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: X1_MODEL
        value: gpt-5
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: x1-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
